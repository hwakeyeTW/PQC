---
# Register PQC Cryptographic Readiness compliance profile on AAP Controller
#
# Usage:
#   ansible-playbook install.yml -e aap_host=https://controller.example.com -e aap_token=<token>
#
# This playbook creates the necessary Controller resources:
#   - Assessment Job Template (pqc_pipeline.yml)
#   - Remediation Job Template (remediate.yml) — placeholder
#
# Prerequisites:
#   - Execution Environment with community.crypto + this collection
#   - Target inventory with RHEL 8/9 hosts
#   - Machine credential with SSH access to targets

- name: "Install: PQC Cryptographic Readiness Compliance Profile"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_host: "{{ lookup('env', 'AAP_HOST') }}"
    aap_token: "{{ lookup('env', 'AAP_API_TOKEN') }}"
    org_name: "{{ organization | default('Default') }}"
    project_name: "{{ project | default('compliance-profile-pqc-readiness') }}"
    ee_name: "{{ execution_environment | default('compliance-pqc-readiness') }}"
    inventory_name: "{{ inventory | default('compliance-rhel-inventory') }}"

    profile:
      name: "PQC Cryptographic Readiness"
      framework: "CUSTOM"
      version: "v1.0.0"
      platform: "RHEL 8/9"
      scanner: "custom"
      certification_status: "uncertified"
      certification_authority: ""
      os_family: ["RedHat"]
      os_version: ["8", "9"]
      scan_jt_name: "compliance-scan-pqc-readiness"
      scan_playbook: "ansible_collections/security/compliance_pqc_readiness/playbooks/pqc_pipeline.yml"
      remediate_jt_name: "compliance-remediate-pqc-readiness"
      remediate_playbook: "playbooks/remediate.yml"

    vault_templates:
      - name: "pqc-vault-deploy"
        playbook: "playbooks/vault_deploy.yml"
        description: "Deploy and initialize HashiCorp Vault as PQC Certificate Authority"
        ask_inventory_on_launch: true
      - name: "pqc-vault-pki-setup"
        playbook: "playbooks/vault_pki_setup.yml"
        description: "Configure Vault PKI engine with Root + Intermediate CA hierarchy"
        ask_inventory_on_launch: false
      - name: "pqc-remediate-certificates"
        playbook: "playbooks/remediate_certificates.yml"
        description: "Replace non-PQC system certificates with Vault-issued certificates"
        ask_inventory_on_launch: true
      - name: "pqc-remediate-crypto-policy"
        playbook: "playbooks/remediate_crypto_policy.yml"
        description: "Update RHEL crypto policies for PQC readiness"
        ask_inventory_on_launch: true
      - name: "pqc-remediate-nginx"
        playbook: "playbooks/remediate_nginx_tls.yml"
        description: "Remediate nginx TLS with Vault-issued certs and PQC key exchange"
        ask_inventory_on_launch: true
      - name: "pqc-remediate-sshd"
        playbook: "playbooks/remediate_sshd.yml"
        description: "Harden SSH configuration with PQC key exchange algorithms"
        ask_inventory_on_launch: true

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - aap_host | length > 0
          - aap_token | length > 0
        fail_msg: "Set AAP_HOST and AAP_API_TOKEN environment variables or pass -e aap_host=... -e aap_token=..."

    - name: Create assessment job template
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ profile.scan_jt_name }}"
          organization: "{{ org_name }}"
          project: "{{ project_name }}"
          playbook: "{{ profile.scan_playbook }}"
          inventory: "{{ inventory_name }}"
          execution_environment: "{{ ee_name }}"
          become_enabled: true
          ask_variables_on_launch: true
          ask_inventory_on_launch: true
          use_fact_cache: true
          extra_vars:
            profile_name: "{{ profile.name }}"
            framework: "{{ profile.framework }}"
            version: "{{ profile.version }}"
            platform: "{{ profile.platform }}"
            scanner: "{{ profile.scanner }}"
            certification_status: "{{ profile.certification_status }}"
            certification_authority: "{{ profile.certification_authority }}"
            os_family: "{{ profile.os_family }}"
            os_version: "{{ profile.os_version }}"
            remediate_jt_name: "{{ profile.remediate_jt_name }}"
            remediation_playbook: "{{ profile.remediate_playbook }}"
        validate_certs: false
        status_code: [200, 201]
      register: _scan_jt
      failed_when: false

    - name: Create remediation job template
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ profile.remediate_jt_name }}"
          organization: "{{ org_name }}"
          project: "{{ project_name }}"
          playbook: "{{ profile.remediate_playbook }}"
          inventory: "{{ inventory_name }}"
          execution_environment: "{{ ee_name }}"
          become_enabled: true
          ask_variables_on_launch: true
          ask_inventory_on_launch: true
          ask_tags_on_launch: true
          ask_limit_on_launch: true
        validate_certs: false
        status_code: [200, 201]
      register: _remediate_jt
      failed_when: false

    - name: Create Vault and remediation job templates
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description }}"
          organization: "{{ org_name }}"
          project: "{{ project_name }}"
          playbook: "{{ item.playbook }}"
          inventory: "{{ inventory_name }}"
          execution_environment: "{{ ee_name }}"
          become_enabled: true
          ask_variables_on_launch: true
          ask_inventory_on_launch: "{{ item.ask_inventory_on_launch }}"
          ask_tags_on_launch: true
          ask_limit_on_launch: true
        validate_certs: false
        status_code: [200, 201]
      loop: "{{ vault_templates }}"
      loop_control:
        label: "{{ item.name }}"
      register: _vault_jts
      failed_when: false

    - name: Report installation result
      ansible.builtin.debug:
        msg: |
          === {{ profile.name }} Profile Installed ===
          Assessment JT: {{ profile.scan_jt_name }} (id={{ _scan_jt.json.id | default('exists') }})
          Remediation JT: {{ profile.remediate_jt_name }} (id={{ _remediate_jt.json.id | default('exists') }})
          Framework: {{ profile.framework }}
          Version: {{ profile.version }}

          Vault & Remediation Job Templates:
          {% for jt in vault_templates %}
            - {{ jt.name }}: {{ jt.description }}
          {% endfor %}
