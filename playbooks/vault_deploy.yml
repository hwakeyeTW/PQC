---
# Deploy and initialize HashiCorp Vault as a PQC Certificate Authority
#
# Usage:
#   ansible-playbook playbooks/vault_deploy.yml -i inventory/hosts.yml -l vault_servers
#
# Required inventory group: vault_servers
# Required variables: none (uses role defaults; override via extra-vars or group_vars)
#
# This playbook:
#   1. Installs HashiCorp Vault from official repos
#   2. Deploys server configuration with TLS
#   3. Generates a self-signed bootstrap TLS certificate
#   4. Initializes Vault and performs auto-unseal
#   5. Enables file audit logging
#
# SECURITY NOTE: The init-keys.json file created during initialization contains
# unseal keys and root token. Secure this file immediately after deployment.
# In production, use auto-unseal with a KMS provider.

- name: "Vault: Deploy and Initialize"
  hosts: vault_servers
  become: true
  gather_facts: true

  roles:
    - role: vault_deploy

  post_tasks:
    - name: Display Vault deployment summary
      ansible.builtin.debug:
        msg: |
          === Vault Deployment Complete ===
          API address: {{ vault_api_addr }}
          Storage backend: {{ vault_storage_backend }}
          TLS: {{ 'enabled (TLS 1.3)' if not vault_tls_disable else 'DISABLED — not recommended for production' }}
          Audit: {{ 'enabled' if vault_enable_audit_file else 'disabled' }}

          Next steps:
            1. Secure {{ vault_config_dir }}/init-keys.json — move keys offline
            2. Run 'ansible-playbook playbooks/vault_pki_setup.yml' to configure the PKI CA
            3. Store Vault credentials in AAP as a HashiCorp Vault credential type
