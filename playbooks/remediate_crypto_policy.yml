---
# Standalone RHEL crypto-policy remediation for PQC readiness
#
# Usage:
#   ansible-playbook playbooks/remediate_crypto_policy.yml
#
# Dry run:
#   ansible-playbook playbooks/remediate_crypto_policy.yml -e remediate_crypto_dry_run=true

- name: "PQC Remediation: RHEL Crypto Policies"
  hosts: pqc_targets
  become: true
  gather_facts: true

  roles:
    - role: remediate_crypto_policy
