all:
  children:
    pqc_targets:
      hosts:
        localhost:
          ansible_connection: local
        rhel01:
          ansible_host: 192.168.1.201
        rhel02:
          ansible_host: 192.168.1.197
        rhel03:
          ansible_host: 192.168.1.136
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_user: root
        ansible_ssh_pass: "{{ vault_ssh_pass }}"

    vault_servers:
      hosts: {}
      vars:
        ansible_python_interpreter: /usr/bin/python3