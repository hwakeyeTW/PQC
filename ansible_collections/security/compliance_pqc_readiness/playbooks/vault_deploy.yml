---
# Deploy and initialize HashiCorp Vault as a PQC Certificate Authority (Collection)
#
# Usage:
#   ansible-playbook security.compliance_pqc_readiness.vault_deploy \
#     -i inventory -l vault_servers

- name: "Vault: Deploy and Initialize"
  hosts: vault_servers
  become: true
  gather_facts: true

  roles:
    - role: security.compliance_pqc_readiness.vault_deploy

  post_tasks:
    - name: Display Vault deployment summary
      ansible.builtin.debug:
        msg: |
          === Vault Deployment Complete ===
          API address: {{ vault_api_addr }}
          Storage backend: {{ vault_storage_backend }}
          TLS: {{ 'enabled (TLS 1.3)' if not vault_tls_disable else 'DISABLED' }}
          Next: Run vault_pki_setup to configure the PKI CA hierarchy.
