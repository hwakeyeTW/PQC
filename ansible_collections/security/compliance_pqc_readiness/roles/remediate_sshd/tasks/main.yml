---
- name: Assess current SSH configuration
  ansible.builtin.import_tasks: assess.yml
  tags:
    - remediate_sshd_assess

- name: Apply PQC SSH configuration
  ansible.builtin.import_tasks: configure.yml
  when: not remediate_sshd_dry_run
  tags:
    - remediate_sshd_configure

- name: Regenerate SSH host keys
  ansible.builtin.import_tasks: host_keys.yml
  when:
    - remediate_sshd_regenerate_host_keys
    - not remediate_sshd_dry_run
  tags:
    - remediate_sshd_host_keys
