---
- name: Scan for non-PQC-compliant certificates
  ansible.builtin.import_tasks: scan.yml
  tags:
    - remediate_cert_scan

- name: Replace non-compliant certificates via Vault
  ansible.builtin.import_tasks: replace.yml
  when:
    - _non_pqc_certs | length > 0
    - not remediate_cert_dry_run
  tags:
    - remediate_cert_replace

- name: Report remediation results
  ansible.builtin.import_tasks: report.yml
  tags:
    - remediate_cert_report
