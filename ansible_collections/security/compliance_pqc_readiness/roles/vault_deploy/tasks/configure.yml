---
- name: Create Vault directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ vault_config_dir }}", mode: "0750" }
    - { path: "{{ vault_data_dir }}", mode: "0750" }
    - { path: "{{ vault_tls_dir }}", mode: "0750" }
    - { path: "{{ vault_log_dir }}", mode: "0750" }
    - { path: "{{ vault_plugin_dir }}", mode: "0750" }

- name: Deploy Vault configuration
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: "{{ vault_config_dir }}/vault.hcl"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0640"
  notify: Restart vault

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: vault.service.j2
    dest: /etc/systemd/system/vault.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart vault

- name: Open firewall ports for Vault
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ vault_firewall_ports }}"
  failed_when: false
