---
vault_version: "1.19.0"
vault_user: vault
vault_group: vault

vault_config_dir: /etc/vault.d
vault_data_dir: /opt/vault/data
vault_tls_dir: /opt/vault/tls
vault_log_dir: /var/log/vault
vault_plugin_dir: /opt/vault/plugins

vault_api_addr: "https://{{ ansible_fqdn }}:8200"
vault_cluster_addr: "https://{{ ansible_fqdn }}:8201"
vault_listen_address: "0.0.0.0:8200"

vault_tls_disable: false
vault_tls_cert_file: "{{ vault_tls_dir }}/vault-cert.pem"
vault_tls_key_file: "{{ vault_tls_dir }}/vault-key.pem"
vault_tls_min_version: "tls13"

vault_storage_backend: file

vault_init_secret_shares: 5
vault_init_secret_threshold: 3

vault_enable_audit_file: true
vault_audit_file_path: "{{ vault_log_dir }}/audit.log"

vault_firewall_ports:
  - 8200/tcp
  - 8201/tcp

vault_seal_type: shamir
