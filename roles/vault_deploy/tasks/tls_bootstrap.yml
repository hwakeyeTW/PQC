---
# Generate a self-signed TLS certificate for Vault's listener.
# In production this should be replaced with a properly-signed certificate.

- name: Check if bootstrap TLS cert exists
  ansible.builtin.stat:
    path: "{{ vault_tls_cert_file }}"
  register: _vault_tls_cert_stat

- name: Generate bootstrap TLS private key
  community.crypto.openssl_privatekey:
    path: "{{ vault_tls_key_file }}"
    type: ECC
    curve: secp384r1
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0600"
  when: not _vault_tls_cert_stat.stat.exists

- name: Generate bootstrap TLS CSR
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ vault_tls_key_file }}"
    common_name: "{{ ansible_fqdn }}"
    subject_alt_name:
      - "DNS:{{ ansible_fqdn }}"
      - "DNS:{{ ansible_hostname }}"
      - "DNS:localhost"
      - "IP:{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
      - "IP:127.0.0.1"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
  register: _vault_tls_csr
  when: not _vault_tls_cert_stat.stat.exists

- name: Generate self-signed bootstrap TLS certificate
  community.crypto.x509_certificate:
    path: "{{ vault_tls_cert_file }}"
    privatekey_path: "{{ vault_tls_key_file }}"
    csr_content: "{{ _vault_tls_csr.csr }}"
    provider: selfsigned
    selfsigned_not_after: "+365d"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0644"
  when: not _vault_tls_cert_stat.stat.exists
  notify: Restart vault
