---
# Internal tasks_from only; trusted caller owns #7 flags, #14 eligibility and scope.
# S02 is HOLD: no sshd evaluation until actual native safety/equivalence is proven.
- name: Validate trusted SSH posture request
  ansible.builtin.assert:
    that:
      - pqc_ssh_request is mapping
      - pqc_ssh_request.keys() | list | sort in [['flags', 'platform_status'], ['context_refs', 'flags', 'platform_status']]
      - pqc_ssh_request.flags is mapping
      - pqc_ssh_request.flags.keys() | list | sort == ['pqc_collect_ssh_host_keys', 'pqc_collect_sshd']
      - pqc_ssh_request.flags.pqc_collect_sshd is boolean
      - pqc_ssh_request.flags.pqc_collect_ssh_host_keys is boolean
      - pqc_ssh_request.platform_status in ['UNVERIFIED', 'UNKNOWN', 'OUT_OF_SCOPE']
      - contexts is sequence and contexts is not string and contexts is not mapping
      - contexts | length >= 1 and contexts | length <= 2
      - contexts | select('string') | list | length == contexts | length
      - contexts | select('match', '^(global-default|ctx-[0-9a-f]{64})\\Z') | list | length == contexts | length
      - contexts | unique | list | length == contexts | length
  vars:
    contexts: "{{ pqc_ssh_request.context_refs | default(['global-default']) }}"
  become: false
  no_log: true

- name: Initialize closed SSH posture snapshot
  ansible.builtin.set_fact:
    pqc_ssh_snapshot:
      flags: "{{ pqc_ssh_request.flags }}"
      platform_status: "{{ pqc_ssh_request.platform_status }}"
      context_refs: "{{ pqc_ssh_request.context_refs | default(['global-default']) }}"
      slots: {}
    cacheable: false
  become: false
  no_log: true

- name: Inspect fixed outer environment executable
  ansible.builtin.stat:
    path: /usr/bin/env
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: pqc_ssh_env
  ignore_errors: true
  when: pqc_ssh_snapshot.platform_status == 'UNVERIFIED' and (pqc_ssh_snapshot.flags.pqc_collect_sshd or pqc_ssh_snapshot.flags.pqc_collect_ssh_host_keys)
  become: false
  no_log: true

- name: Inspect fixed timeout executable
  ansible.builtin.stat:
    path: /usr/bin/timeout
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: pqc_ssh_timer
  ignore_errors: true
  when: pqc_ssh_snapshot.platform_status == 'UNVERIFIED' and (pqc_ssh_snapshot.flags.pqc_collect_sshd or pqc_ssh_snapshot.flags.pqc_collect_ssh_host_keys)
  become: false
  no_log: true

- name: Inspect trusted system Python executable
  ansible.builtin.stat:
    path: /usr/bin/python3
    follow: true
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: pqc_ssh_python
  ignore_errors: true
  when: pqc_ssh_snapshot.platform_status == 'UNVERIFIED' and (pqc_ssh_snapshot.flags.pqc_collect_sshd or pqc_ssh_snapshot.flags.pqc_collect_ssh_host_keys)
  become: false
  no_log: true

- name: Acquire fixed slots without shell or destination
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - -i
      - PATH=/usr/bin:/usr/sbin
      - LC_ALL=C
      - HOME=/nonexistent
      - /usr/bin/timeout
      - --signal=TERM
      - --kill-after=2s
      - 27s
      - /usr/bin/python3
      - -I
      - -B
      - -c
      - |
        import base64
        import binascii
        import hashlib
        import json
        import os
        import re
        import selectors
        import stat
        import struct
        import subprocess
        import sys
        import time

        LIMIT = 16384
        MAX_ROWS = 256
        MAX_CONFIG_ROWS = 512
        TOKEN = re.compile(r'[A-Za-z0-9][A-Za-z0-9_.+@-]{0,127}\Z', re.ASCII)
        KEY_FILE = re.compile(r'ssh_host_[A-Za-z0-9_-]{1,64}_key\.pub\Z', re.ASCII)
        DROPIN = re.compile(r'[A-Za-z0-9][A-Za-z0-9_.-]{0,100}\.conf\Z', re.ASCII)
        CLIENTS = {f'client-{q}': ['/usr/bin/ssh', '-Q', q] for q in ('kex', 'cipher', 'key', 'sig', 'mac')}
        SETTINGS = {'kexalgorithms', 'ciphers', 'macs', 'hostkeyalgorithms', 'pubkeyacceptedalgorithms',
                    'pubkeyacceptedkeytypes', 'hostbasedacceptedalgorithms', 'hostbasedacceptedkeytypes',
                    'casignaturealgorithms', 'gssapikexalgorithms'}
        HAZARDS = {'hostkeyagent', 'authorizedkeyscommand', 'authorizedkeyscommanduser',
                   'authorizedprincipalscommand', 'authorizedprincipalscommanduser', 'hostcertificate',
                   'authorizedkeysfile', 'authorizedprincipalsfile', 'revokedkeys', 'trustedusercakeys',
                   'forcecommand', 'subsystem', 'chrootdirectory', 'modulifile', 'banner', 'usepam'}
        GAPS = {'SOURCE_MISSING', 'SOURCE_PERMISSION', 'SOURCE_UNSAFE', 'FORMAT_GAP', 'INCLUDE_REJECTED',
                'INCLUDE_REPEATED', 'INCLUDE_EMPTY', 'MATCH_UNRESOLVED', 'NATIVE_DEPENDENCY',
                'HOSTKEY_PATH_REJECTED', 'KEY_INVALID', 'KEY_TYPE_UNKNOWN'}
        ROOT_PATH = '/'


        def result(state, reason, rc=None, rows=None, gaps=None):
            return dict(state=state, reason=reason, rc=rc, rows=[] if rows is None else rows,
                        gaps=[] if gaps is None else sorted(set(gaps)))


        def digest(prefix, parts):
            wire = json.dumps(parts, ensure_ascii=True, separators=(',', ':')).encode('ascii')
            return prefix + '-' + hashlib.sha256(wire).hexdigest()


        def key_ref(name):
            return digest('key', ['ssh-host-public-source-v1', name])


        def capture(argv, seconds=23):
            # Called only with fixed argv by the production entry. Test primitive is not an API.
            end = time.monotonic() + seconds
            p = None
            reason = None
            out = [bytearray(), bytearray()]
            try:
                p = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                     stderr=subprocess.PIPE, env={'PATH': '/usr/bin:/usr/sbin', 'LC_ALL': 'C',
                                                                  'HOME': '/nonexistent'}, close_fds=True)
                with selectors.DefaultSelector() as sel:
                    for i, f in enumerate((p.stdout, p.stderr)):
                        sel.register(f, selectors.EVENT_READ, i)
                    while sel.get_map():
                        left = end - time.monotonic()
                        if left <= 0:
                            reason = 'TIMEOUT'
                            break
                        for k, _ in sel.select(left):
                            room = LIMIT - sum(map(len, out))
                            chunk = os.read(k.fd, min(4096, room + 1))
                            if len(chunk) > room:
                                reason = 'OUTPUT_LIMIT'
                                break
                            if chunk:
                                out[k.data].extend(chunk)
                            else:
                                sel.unregister(k.fileobj)
                        if reason:
                            break
                if reason is None:
                    p.wait(timeout=max(0, end - time.monotonic()))
            except subprocess.TimeoutExpired:
                reason = 'TIMEOUT'
            except PermissionError:
                reason = 'PERMISSION_DENIED'
            except FileNotFoundError:
                reason = 'TOOL_UNAVAILABLE'
            except (OSError, ValueError):
                reason = 'EXECUTION_ERROR'
            finally:
                if p is not None:
                    if p.poll() is None:
                        try:
                            p.kill()
                            p.wait(timeout=1)
                        except (OSError, subprocess.TimeoutExpired):
                            # Do not report success or exit ahead of the outer group deadline.
                            time.sleep(30)
                            reason = 'CLEANUP_FAILED'
                    p.stdout.close()
                    p.stderr.close()
            return reason, None if p is None else p.returncode, bytes(out[0]), bytes(out[1])


        def tool_error(path):
            try:
                st = os.stat(path, follow_symlinks=False)
                if not stat.S_ISREG(st.st_mode):
                    return result('UNKNOWN', 'TOOL_UNSAFE_PATH')
                if not os.access(path, os.X_OK):
                    return result('UNKNOWN', 'TOOL_NOT_EXECUTABLE')
            except FileNotFoundError:
                return result('UNKNOWN', 'TOOL_UNAVAILABLE')
            except PermissionError:
                return result('PERMISSION_DENIED', 'PERMISSION_DENIED')
            except OSError:
                return result('ERROR', 'EXECUTION_ERROR')
            return None


        def parse_client(rc, out, err):
            if len(out) + len(err) > LIMIT:
                return result('ERROR', 'OUTPUT_LIMIT', rc)
            if rc != 0 or err:
                if b'Permission denied' in err:
                    return result('PERMISSION_DENIED', 'PERMISSION_DENIED', rc)
                if rc != 0 and (b'Unsupported query' in err or b'unknown query' in err.lower()):
                    return result('UNKNOWN', 'UNSUPPORTED_QUERY', rc)
                return result('ERROR', 'COMMAND_FAILED', rc)
            if not out:
                return result('UNKNOWN', 'NO_OUTPUT', rc)
            if not out.endswith(b'\n'):
                return result('ERROR', 'INCOMPLETE_OUTPUT', rc)
            try:
                lines = out.decode('ascii').split('\n')[:-1]
            except UnicodeError:
                return result('ERROR', 'INVALID_ENCODING', rc)
            if len(lines) > MAX_ROWS:
                return result('ERROR', 'ROW_LIMIT', rc)
            rows = sorted(set(x for x in lines if TOKEN.fullmatch(x)))
            if not rows:
                return result('UNKNOWN', 'UNRECOGNIZED_OUTPUT', rc)
            gap = len(rows) != len(lines)
            return result('PARTIAL' if gap else 'COLLECTED', 'FORMAT_GAP' if gap else 'OK', rc, rows,
                          ['FORMAT_GAP'] if gap else [])


        class ReadFailure(Exception):
            def __init__(self, code):
                self.code = code
                super().__init__(code)


        class LimitFailure(ReadFailure):
            pass


        def signature(st):
            return (st.st_dev, st.st_ino, st.st_mode, st.st_nlink, st.st_uid, st.st_gid,
                    st.st_size, st.st_mtime_ns, st.st_ctime_ns)


        class Reader:
            """Linux descriptor-anchored bounded read. No arbitrary paths from a caller.

            O_PATH pins the inode before opening for data; reject links, special files,
            hard links and drift before any read. /proc/self/fd refers only to our FD.
            Directory and file identities are checked again after the whole traversal.
            """
            def __init__(self, root, aggregate, purpose):
                self.purpose = purpose
                self.root = root
                self.aggregate = aggregate
                self.total = 0
                self.dirs = {(): (root, None)}
                self.files = {}
                self.listings = {}
                self.end = time.monotonic() + 23

            def __enter__(self):
                return self

            def __exit__(self, *_):
                for parts, (fd, _) in reversed(list(self.dirs.items())):
                    if parts:
                        os.close(fd)

            def deadline(self):
                if time.monotonic() >= self.end:
                    raise LimitFailure('TIMEOUT')

            def directory(self, parts):
                allowed = {(), ('etc',), ('etc', 'ssh')}
                if self.purpose == 'config':
                    allowed.update({('etc', 'ssh', 'sshd_config.d'), ('etc', 'crypto-policies'),
                                    ('etc', 'crypto-policies', 'back-ends')})
                if parts not in allowed:
                    raise ReadFailure('SOURCE_UNSAFE')
                self.deadline()
                if parts in self.dirs:
                    return self.dirs[parts][0]
                parent = self.directory(parts[:-1])
                fd = os.open(parts[-1], os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC,
                             dir_fd=parent)
                try:
                    st = os.fstat(fd)
                    if not stat.S_ISDIR(st.st_mode) or signature(os.stat(parts[-1], dir_fd=parent,
                                                                          follow_symlinks=False)) != signature(st):
                        raise LimitFailure('SOURCE_DRIFT')
                    self.dirs[parts] = (fd, signature(st))
                    return fd
                except BaseException:
                    os.close(fd)
                    raise

            def names(self, parts):
                if parts not in self.listings:
                    fd = self.directory(parts)
                    names = []
                    with os.scandir(fd) as entries:
                        for entry in entries:
                            self.deadline()
                            if len(names) >= 256:
                                raise LimitFailure('DIRECTORY_LIMIT')
                            names.append(entry.name)
                    self.listings[parts] = sorted(names)
                return self.listings[parts]

            def read(self, parts, name):
                self.deadline()
                if self.purpose == 'keys':
                    allowed = parts == ('etc', 'ssh') and KEY_FILE.fullmatch(name)
                else:
                    allowed = ((parts == ('etc', 'ssh') and name == 'sshd_config') or
                               (parts == ('etc', 'ssh', 'sshd_config.d') and DROPIN.fullmatch(name)) or
                               (parts == ('etc', 'crypto-policies', 'back-ends') and name == 'opensshserver.config'))
                if not allowed:
                    raise ReadFailure('SOURCE_UNSAFE')
                fd = self.directory(parts)
                pin = os.open(name, os.O_PATH | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=fd)
                try:
                    st = os.fstat(pin)
                    if not stat.S_ISREG(st.st_mode) or st.st_nlink != 1:
                        raise ReadFailure('SOURCE_UNSAFE')
                    if st.st_size > LIMIT or self.total + st.st_size > self.aggregate:
                        raise LimitFailure('INPUT_LIMIT')
                    expected = signature(st)
                    try:
                        path_signature = signature(os.stat(name, dir_fd=fd, follow_symlinks=False))
                    except OSError:
                        raise LimitFailure('SOURCE_DRIFT') from None
                    if path_signature != expected:
                        raise LimitFailure('SOURCE_DRIFT')
                    data_fd = os.open('/proc/self/fd/' + str(pin), os.O_RDONLY | os.O_NONBLOCK | os.O_CLOEXEC)
                    try:
                        if signature(os.fstat(data_fd)) != expected:
                            raise LimitFailure('SOURCE_DRIFT')
                        data = bytearray()
                        while len(data) <= st.st_size:
                            self.deadline()
                            chunk = os.read(data_fd, min(4096, st.st_size + 1 - len(data)))
                            if not chunk:
                                break
                            data.extend(chunk)
                        if len(data) != st.st_size or signature(os.fstat(data_fd)) != expected:
                            raise LimitFailure('SOURCE_DRIFT')
                    finally:
                        os.close(data_fd)
                    self.total += len(data)
                    self.files[(parts, name)] = expected
                    return bytes(data)
                finally:
                    os.close(pin)

            def verify(self):
                try:
                    for parts, (fd, expected) in self.dirs.items():
                        self.deadline()
                        if parts and (signature(os.fstat(fd)) != expected or
                                      signature(os.stat(parts[-1], dir_fd=self.dirs[parts[:-1]][0],
                                                        follow_symlinks=False)) != expected):
                            raise LimitFailure('SOURCE_DRIFT')
                    for (parts, name), expected in self.files.items():
                        self.deadline()
                        if signature(os.stat(name, dir_fd=self.dirs[parts][0], follow_symlinks=False)) != expected:
                            raise LimitFailure('SOURCE_DRIFT')
                except OSError:
                    raise LimitFailure('SOURCE_DRIFT') from None


        def read_gap(exc):
            if isinstance(exc, ReadFailure):
                return exc.code
            if isinstance(exc, FileNotFoundError):
                return 'SOURCE_MISSING'
            if isinstance(exc, PermissionError):
                return 'SOURCE_PERMISSION'
            return 'SOURCE_UNSAFE'


        def collect_config(root):
            ssh = ('etc', 'ssh')
            drop = ssh + ('sshd_config.d',)
            backend = ('etc', 'crypto-policies', 'back-ends')
            rows, gaps, seen = [], set(), set()
            with Reader(root, 65536, 'config') as reader:
                def emit(kind, src, line, ctx, **payload):
                    if len(rows) >= MAX_CONFIG_ROWS:
                        raise LimitFailure('ROW_LIMIT')
                    rows.append(dict(kind=kind, order=len(rows), source_ref=src, line=line,
                                     context_ref=ctx, **payload))

                def visit(parts, name, kind, parent, include_line, depth, ctx):
                    if depth > 4 or len(seen) >= 32:
                        raise LimitFailure('SOURCE_LIMIT')
                    identity = (parts, name)
                    if identity in seen:
                        gaps.add('INCLUDE_REPEATED')
                        return ctx
                    seen.add(identity)
                    try:
                        raw = reader.read(parts, name)
                    except LimitFailure:
                        raise
                    except (ReadFailure, OSError) as exc:
                        gaps.add(read_gap(exc))
                        return ctx
                    if b'PRIVATE KEY-----' in raw or b'\x00' in raw:
                        gaps.add('SOURCE_UNSAFE')
                        return ctx
                    raw = raw.replace(b'\r\n', b'\n')
                    if any(x < 32 and x not in (9, 10) or x == 127 for x in raw):
                        gaps.add('FORMAT_GAP')
                        return ctx
                    try:
                        lines = raw.decode('utf-8').split('\n')
                    except UnicodeError:
                        gaps.add('FORMAT_GAP')
                        return ctx
                    ref = digest('src', ['ssh-config-v1', list(parts), name])
                    emit('SOURCE', ref, 0, ctx, source_kind=kind, parent_ref=parent,
                         include_line=include_line, depth=depth)
                    for number, raw_line in enumerate(lines, 1):
                        reader.deadline()
                        line = raw_line.strip(' \t')
                        if not line or line.startswith('#'):
                            continue
                        match = re.fullmatch(r'([A-Za-z][A-Za-z0-9]*)(?:[ \t]*=[ \t]*|[ \t]+)(.*)', line)
                        if not match:
                            gaps.add('FORMAT_GAP')
                            continue
                        setting, value = match[1].lower(), match[2].strip(' \t')
                        if setting == 'match':
                            ctx = digest('ctx', [ref, number])
                            emit('MATCH', ref, number, ctx, match_kind='ALL' if value.lower() == 'all' else 'CONDITIONAL')
                            if value.lower() != 'all':
                                gaps.add('MATCH_UNRESOLVED')
                        elif setting == 'include':
                            # No shlex, glob expansion or arbitrary path evaluation. Only exact approved forms.
                            args = value.split()
                            if not args or any(x not in ('/etc/ssh/sshd_config.d/*.conf', 'sshd_config.d/*.conf',
                                '/etc/crypto-policies/back-ends/opensshserver.config') for x in args):
                                emit('INCLUDE', ref, number, ctx, outcome='REJECTED')
                                gaps.add('INCLUDE_REJECTED')
                                continue
                            emit('INCLUDE', ref, number, ctx, outcome='ALLOWLISTED')
                            for arg in args:
                                if arg.endswith('/*.conf'):
                                    try:
                                        names = reader.names(drop)
                                    except LimitFailure:
                                        raise
                                    except (ReadFailure, OSError) as exc:
                                        gaps.add(read_gap(exc))
                                        continue
                                    candidates = [n for n in names if n.endswith('.conf') and not n.startswith('.')]
                                    if not candidates:
                                        gaps.add('INCLUDE_EMPTY')
                                    for candidate in candidates:
                                        if not DROPIN.fullmatch(candidate):
                                            gaps.add('SOURCE_UNSAFE')
                                            continue
                                        ctx = visit(drop, candidate, 'DROPIN', ref, number, depth + 1, ctx)
                                else:
                                    ctx = visit(backend, 'opensshserver.config', 'POLICY_BACKEND', ref, number, depth + 1, ctx)
                        elif setting in SETTINGS:
                            op = value[0] if value and value[0] in '+-^' else ''
                            names = (value[1:] if op else value).split(',')
                            # Preserve operator/wildcard as declarations only; no evaluation.
                            if len(names) > MAX_ROWS:
                                raise LimitFailure('ROW_LIMIT')
                            if not all(re.fullmatch(r'[A-Za-z0-9*?][A-Za-z0-9_.+@*?-]{0,127}', n, re.ASCII) for n in names):
                                gaps.add('FORMAT_GAP')
                                continue
                            if len(set(names)) != len(names):
                                gaps.add('FORMAT_GAP')
                                continue
                            emit('DIRECTIVE', ref, number, ctx, setting=setting, operator=op or 'EXACT', values=names)
                        elif setting == 'hostkey':
                            name = value.removeprefix('/etc/ssh/') + '.pub'
                            if value.startswith('/etc/ssh/') and KEY_FILE.fullmatch(name):
                                emit('KEY_REFERENCE', ref, number, ctx, key_source_ref=key_ref(name))
                            else:
                                emit('HAZARD', ref, number, ctx, hazard='HOSTKEY_PATH_REJECTED')
                                gaps.add('HOSTKEY_PATH_REJECTED')
                        elif setting in HAZARDS:
                            emit('HAZARD', ref, number, ctx, hazard='NATIVE_DEPENDENCY')
                            gaps.add('NATIVE_DEPENDENCY')
                    return ctx

                try:
                    visit(ssh, 'sshd_config', 'MAIN', None, None, 0, 'global-default')
                    reader.verify()
                except LimitFailure as exc:
                    return result('ERROR', exc.code)
                except OSError:
                    return result('ERROR', 'SOURCE_DRIFT')
            if not rows:
                code = 'SOURCE_PERMISSION' if 'SOURCE_PERMISSION' in gaps else 'SOURCE_MISSING' if 'SOURCE_MISSING' in gaps else 'SOURCE_UNSAFE' if 'SOURCE_UNSAFE' in gaps else 'UNRECOGNIZED_OUTPUT'
                return result('PERMISSION_DENIED' if code == 'SOURCE_PERMISSION' else 'UNKNOWN', code)
            return result('PARTIAL' if gaps else 'COLLECTED', 'CONFIG_GAP' if gaps else 'OK', rows=rows, gaps=gaps)


        def parse_public(raw):
            # No PEM, private-key marker, comments, raw base64 or wire bytes are exported.
            if b'PRIVATE KEY-----' in raw or b'\x00' in raw or len(raw) > LIMIT:
                raise ReadFailure('KEY_INVALID')
            line = raw[:-1] if raw.endswith(b'\n') else raw
            if raw.endswith(b'\r\n'):
                line = line[:-1]
            if any(x < 32 and x != 9 or x == 127 for x in line):
                raise ReadFailure('KEY_INVALID')
            fields = re.split(rb'[ \t]+', line, maxsplit=2)
            try:
                if len(fields) < 2:
                    raise ValueError
                name = fields[0].decode('ascii')
                if not TOKEN.fullmatch(name) or not name.startswith(('ssh-', 'ecdsa-', 'sk-')) or 'private' in name.lower():
                    raise ValueError
                wire = base64.b64decode(fields[1], validate=True)
                if base64.b64encode(wire) != fields[1]:
                    raise ValueError
                offset = 0

                def string():
                    nonlocal offset
                    if offset + 4 > len(wire):
                        raise ValueError
                    length = struct.unpack_from('>I', wire, offset)[0]
                    offset += 4
                    if length > LIMIT or offset + length > len(wire):
                        raise ValueError
                    item = wire[offset:offset + length]
                    offset += length
                    return item

                def positive():
                    item = string()
                    if not item or item[0] & 128 or (item[0] == 0 and (len(item) == 1 or not item[1] & 128)):
                        raise ValueError
                    return int.from_bytes(item, 'big').bit_length()

                if string() != fields[0]:
                    raise ValueError
                bits = None
                if name == 'ssh-rsa':
                    positive()
                    bits = positive()
                elif name == 'ssh-dss':
                    bits = positive()
                    for _ in range(3):
                        positive()
                elif name == 'ssh-ed25519':
                    if len(string()) != 32:
                        raise ValueError
                    bits = 256
                elif name in ('ecdsa-sha2-nistp256', 'ecdsa-sha2-nistp384', 'ecdsa-sha2-nistp521'):
                    curve = name.removeprefix('ecdsa-sha2-')
                    bits = int(curve[5:])
                    if string() != curve.encode('ascii'):
                        raise ValueError
                    point = string()
                    if len(point) != 1 + 2 * ((bits + 7) // 8) or point[:1] != b'\x04':
                        raise ValueError
                else:
                    # Unknown layout: validate only the type envelope and nonempty payload;
                    # this remains a partial syntactic observation, not proof of key validity.
                    if offset == len(wire):
                        raise ValueError
                if bits is not None and (offset != len(wire) or not 1 <= bits <= 16384):
                    raise ValueError
            except (ValueError, UnicodeError, binascii.Error, struct.error):
                raise ReadFailure('KEY_INVALID') from None
            return dict(key_type=name, bits=bits, fingerprint_sha256=hashlib.sha256(wire).hexdigest(),
                        grammar='KNOWN' if bits is not None else 'UNKNOWN_TYPE')


        def collect_keys(root):
            rows, gaps = [], set()
            parts = ('etc', 'ssh')
            with Reader(root, 524288, 'keys') as reader:
                try:
                    names = reader.names(parts)
                    candidates = [name for name in names if name.startswith('ssh_host_') and name.endswith('_key.pub')]
                    if len(candidates) > 32:
                        raise LimitFailure('SOURCE_LIMIT')
                    for name in candidates:
                        if not KEY_FILE.fullmatch(name):
                            gaps.add('SOURCE_UNSAFE')
                            continue
                        try:
                            value = parse_public(reader.read(parts, name))
                        except LimitFailure:
                            raise
                        except (OSError, ReadFailure) as exc:
                            gaps.add(read_gap(exc))
                            continue
                        if value['grammar'] == 'UNKNOWN_TYPE':
                            gaps.add('KEY_TYPE_UNKNOWN')
                        rows.append(dict(source_ref=key_ref(name), **value))
                    reader.verify()
                except LimitFailure as exc:
                    return result('ERROR', exc.code)
                except (OSError, ReadFailure) as exc:
                    code = read_gap(exc)
                    return result('PERMISSION_DENIED' if code == 'SOURCE_PERMISSION' else 'UNKNOWN', code)
            if not rows and gaps:
                code = 'SOURCE_PERMISSION' if 'SOURCE_PERMISSION' in gaps else 'KEY_INVALID' if 'KEY_INVALID' in gaps else 'SOURCE_UNSAFE'
                return result('PERMISSION_DENIED' if code == 'SOURCE_PERMISSION' else 'UNKNOWN', code)
            return result('PARTIAL' if gaps else 'COLLECTED', 'KEY_GAP' if gaps else 'OK',
                          rows=sorted(rows, key=lambda r: r['source_ref']), gaps=gaps)


        def run_slot(slot):
            if slot in CLIENTS:
                failed = tool_error('/usr/bin/ssh')
                if failed:
                    return failed
                reason, rc, out, err = capture(CLIENTS[slot])
                if reason:
                    state = 'PERMISSION_DENIED' if reason == 'PERMISSION_DENIED' else 'UNKNOWN' if reason == 'TOOL_UNAVAILABLE' else 'ERROR'
                    return result(state, reason, rc)
                return parse_client(rc, out, err)
            if slot in ('native-0', 'native-1'):
                # S02 HOLD: no invocation until actual native isolation/equivalence is proven.
                return tool_error('/usr/sbin/sshd') or result('UNKNOWN', 'NATIVE_SAFETY_UNPROVEN')
            if slot not in ('config', 'keys'):
                return result('ERROR', 'INVALID_SLOT')
            try:
                root = os.open(ROOT_PATH, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC)
                try:
                    return collect_config(root) if slot == 'config' else collect_keys(root)
                finally:
                    os.close(root)
            except (OSError, ReadFailure):
                return result('ERROR', 'EXECUTION_ERROR')


        if __name__ == '__main__':
            if len(sys.argv) != 2 or sys.argv[1] not in (*CLIENTS, 'config', 'keys', 'native-0', 'native-1'):
                sys.exit(2)
            output = json.dumps(run_slot(sys.argv[1]), ensure_ascii=True, separators=(',', ':'))
            if len(output) > 262144:
                output = json.dumps(result('ERROR', 'OUTPUT_LIMIT'), separators=(',', ':'))
            print(output)
      - "{{ item }}"
    expand_argument_vars: false
  loop: "{{ ['client-kex', 'client-cipher', 'client-key', 'client-sig', 'client-mac', 'config', 'keys', 'native-0'] + (['native-1'] if pqc_ssh_snapshot.context_refs | length == 2 else []) }}"
  register: pqc_ssh_queries
  when:
    - pqc_ssh_snapshot.platform_status == 'UNVERIFIED'
    - pqc_ssh_snapshot.flags.pqc_collect_ssh_host_keys if item == 'keys' else pqc_ssh_snapshot.flags.pqc_collect_sshd
    - not item.startswith('native-') or pqc_ssh_snapshot.flags.pqc_collect_ssh_host_keys
    - pqc_ssh_env.stat.isreg | default(false) and pqc_ssh_env.stat.islnk is sameas false and pqc_ssh_env.stat.executable | default(false)
    - pqc_ssh_timer.stat.isreg | default(false) and pqc_ssh_timer.stat.islnk is sameas false and pqc_ssh_timer.stat.executable | default(false)
    - pqc_ssh_python.stat.isreg | default(false) and pqc_ssh_python.stat.executable | default(false)
  changed_when: false
  ignore_errors: true
  become: false
  no_log: true

- name: Project only bounded typed results
  ansible.builtin.set_fact:
    pqc_ssh_snapshot: "{{ pqc_ssh_snapshot | combine({'slots': {item.item: slot_value}}, recursive=true) }}"
    cacheable: false
  vars:
    enabled: "{{ pqc_ssh_snapshot.flags.pqc_collect_ssh_host_keys if item.item == 'keys' else pqc_ssh_snapshot.flags.pqc_collect_sshd }}"
    denied: "{{ item.item.startswith('native-') and not pqc_ssh_snapshot.flags.pqc_collect_ssh_host_keys }}"
    missing_permission: >-
      {{ 'Permission denied' in (pqc_ssh_env.msg | default('')) or
         'Permission denied' in (pqc_ssh_timer.msg | default('')) or
         'Permission denied' in (pqc_ssh_python.msg | default('')) }}
    skipped_state: >-
      {{ 'NOT_SCANNED' if not enabled else 'NOT_APPLICABLE' if pqc_ssh_snapshot.platform_status == 'OUT_OF_SCOPE' else
         'PERMISSION_DENIED' if pqc_ssh_snapshot.platform_status == 'UNVERIFIED' and not denied and missing_permission else 'UNKNOWN' }}
    skipped_reason: >-
      {{ 'DISABLED_BY_USER' if not enabled else 'PLATFORM_OUT_OF_SCOPE' if pqc_ssh_snapshot.platform_status == 'OUT_OF_SCOPE' else
         'PLATFORM_UNRESOLVED' if pqc_ssh_snapshot.platform_status == 'UNKNOWN' else 'KEY_FLAG_REQUIRED' if denied else
         'PERMISSION_DENIED' if missing_permission else 'TOOL_UNAVAILABLE' }}
    slot_value: >-
      {{ dict(state=skipped_state, reason=skipped_reason, rc=none, rows=[], gaps=[]) if item.skipped | default(false) else
         ((item.stdout | from_json) if item.rc | default(-1) == 0 else
          dict(state='ERROR', reason=('OUTER_DEADLINE' if item.rc | default(-1) in [124, 137] else 'HELPER_ERROR'), rc=none, rows=[], gaps=[])) }}
  loop: "{{ pqc_ssh_queries.results }}"
  become: false
  no_log: true
