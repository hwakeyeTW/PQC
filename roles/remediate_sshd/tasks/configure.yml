---
- name: Build final KEX algorithm list (only available ones)
  ansible.builtin.set_fact:
    _final_kex: >-
      {{ remediate_sshd_kex_algorithms
         | select('in', _ssh_kex_support.stdout_lines | default([]))
         | list }}

- name: Backup sshd_config
  ansible.builtin.copy:
    src: "{{ remediate_sshd_config_path }}"
    dest: "{{ remediate_sshd_config_path }}.pre-pqc.{{ ansible_date_time.iso8601_basic_short }}"
    remote_src: true
    mode: preserve
  when: remediate_sshd_backup

- name: Deploy PQC SSH configuration drop-in
  ansible.builtin.copy:
    content: |
      # PQC SSH hardening — managed by PQC-AAP remediation
      # Applied: {{ ansible_date_time.iso8601 }}

      KexAlgorithms {{ _final_kex | join(',') }}
      HostKeyAlgorithms {{ remediate_sshd_host_key_algorithms | join(',') }}
      Ciphers {{ remediate_sshd_ciphers | join(',') }}
      MACs {{ remediate_sshd_macs | join(',') }}
    dest: /etc/ssh/sshd_config.d/50-pqc-hardening.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart sshd

- name: Validate sshd configuration
  ansible.builtin.command:
    cmd: sshd -t
  register: _sshd_test
  changed_when: false

- name: Fail if sshd config is invalid
  ansible.builtin.assert:
    that:
      - _sshd_test.rc == 0
    fail_msg: >-
      sshd configuration validation failed. Check /etc/ssh/sshd_config.d/50-pqc-hardening.conf.
      Error: {{ _sshd_test.stderr | default('unknown') }}
